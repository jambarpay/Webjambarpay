version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
      test-tooling:
        patterns:
          - '*eslint*'
          - '*jasmine*'
          - '*karma*'
          - '*playwright*'
