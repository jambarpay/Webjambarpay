  <button type="button" class="skip-link" (click)="skipToMainContent()">Aller au contenu principal</button>
  <app-sidebar></app-sidebar>
  <div class="main-content">
    <app-topbar [pageTitle]="pageTitle()" [pageSubtitle]="pageSubtitle()"></app-topbar>

    </main>
  </div>
</div>
