  <button type="button" class="action-btn action-secondary export-action" (click)="exportEmployees()">
    <i class="pi pi-download" aria-hidden="true"></i>
    <span>Exporter Excel</span>
  </button>
</div>

<app-feedback-message [state]="feedback()" />

<section class="employees-card">
  <div class="employees-header">
    <h2>Liste des salariés</h2>

    <div class="employees-tools">
      <div class="table-search">
        <i class="pi pi-search"></i>
        <input
          pInputText
          type="text"
          [ngModel]="searchTerm()"
          (ngModelChange)="onSearchChange($event)"
          placeholder="Rechercher un salarie"
          aria-label="Rechercher un salarié" />
      </div>

      <div class="filter-wrap">
        <button type="button" class="filter-btn" (click)="toggleFilterMenu()">
          <i class="pi pi-filter"></i>
          <span>{{ statusFilter() }}</span>
        </button>
        @if (filterMenuOpen()) {
          <div class="filter-menu">
            @for (status of statusOptions; track status) {
              <button
                type="button"
                class="filter-option"
                [class.active]="statusFilter() === status"
                (click)="setStatusFilter(status)">
                {{ status }}
              </button>
            }
          </div>
        }
      </div>
    </div>
  </div>

  <p-table [value]="employees()" styleClass="employees-table">
    <ng-template pTemplate="header">
      <tr>
        <th>Nom</th>
        <th>Email</th>
        <th>Telephone</th>
        <th>Solde</th>
        <th>Statut</th>
        <th>Action</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td data-label="Nom">{{ row.name }}</td>
        <td data-label="Email">{{ row.email }}</td>
        <td data-label="Telephone">{{ row.phone }}</td>
        <td data-label="Solde">{{ row.balance }}</td>
        <td data-label="Statut" class="status-valid">{{ row.status }}</td>
        <td data-label="Action">
          <button
            type="button"
            class="row-action"
            [attr.aria-label]="'Voir l’historique de ' + row.name"
            title="Voir l’historique"
            (click)="goToEmployeeHistory(row.name)">
            <i class="pi pi-history"></i>
          </button>
          <button
            type="button"
            class="row-action"
            [attr.aria-label]="'Télécharger le rapport mensuel de ' + row.name"
            title="Rapport mensuel PDF"
            (click)="exportMonthlyReport(row)">
            <i class="pi pi-file-pdf"></i>
          </button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6" class="empty-message"><app-empty-state message="Aucun salarié trouvé." /></td>
      </tr>
    </ng-template>
  </p-table>
</section>

<app-pagination
  [currentPage]="currentPage()"
  [totalPages]="totalPages()"
  [pageSize]="pageSize()"
  [pageSizeOptions]="pageSizeOptions"
  ariaLabel="Pagination des salariés"
  (pageChange)="setPage($event)"
  (pageSizeChange)="setPageSize($event)" />
