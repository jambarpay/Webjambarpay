<section class="add-employee-panel">
  <form class="employee-form" (ngSubmit)="onSubmit()" novalidate>
    <h2>Ajouter un salari&eacute;</h2>

    <div class="form-grid">
      <label class="field" for="employee-name">
        <span>Nom du salari&eacute;<strong>*</strong></span>
        <input id="employee-name" type="text" name="name" [(ngModel)]="form.name" [class.input-invalid]="submitted() && !!nameError" placeholder="Ex : Awa Diop" />
        @if (submitted() && !!nameError) {
          <small class="field-error">{{ nameError }}</small>
        }
      </label>

      <label class="field" for="employee-email">
        <span>Adresse e-mail<strong>*</strong></span>
        <input id="employee-email" type="email" name="email" [(ngModel)]="form.email" [class.input-invalid]="submitted() && !!emailError" placeholder="Ex : awa.diop@entreprise.com" autocomplete="email" />
        @if (submitted() && !!emailError) {
          <small class="field-error">{{ emailError }}</small>
        }
      </label>

      <label class="field" for="employee-phone">
        <span>Numero de t&eacute;l&eacute;phone<strong>*</strong></span>
        <input id="employee-phone" type="tel" name="phone" [(ngModel)]="form.phone" [class.input-invalid]="submitted() && !!phoneError" placeholder="Ex : 77 123 45 67" />
        @if (submitted() && !!phoneError) {
          <small class="field-error">{{ phoneError }}</small>
        }
      </label>

    </div>

    <p class="helper-text">
      L’adresse e-mail est enregistrée avec le salarié. Le user-service envoie toujours le code OTP par WhatsApp.
    </p>

    @if (errorMessage()) {
      <p class="field-error" role="alert">{{ errorMessage() }}</p>
    }

    <div class="form-actions">
      <a routerLink="/enterprise-employees" class="btn btn-cancel">Annuler</a>
      <button type="submit" class="btn btn-save" [disabled]="submitting()">
        {{ submitting() ? 'Enregistrement…' : 'Enregistrer le salarié' }}
      </button>
    </div>
  </form>
</section>
