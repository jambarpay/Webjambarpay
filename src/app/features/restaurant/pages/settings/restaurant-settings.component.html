<section class="settings-page">
  <article class="settings-card settings-card-wide">
    <div class="section-head">
      <h2>Informations du restaurant</h2>
      <p>Mettez à jour vos informations d'identité et de contact.</p>
    </div>

    <div class="settings-grid">
      <label class="field" for="restaurant-name">
        <span>Nom</span>
        <input id="restaurant-name" [(ngModel)]="restaurantName" type="text" />
      </label>

      <label class="field" for="restaurant-manager">
        <span>Responsable</span>
        <input id="restaurant-manager" [(ngModel)]="managerName" type="text" />
      </label>

      <label class="field" for="restaurant-email">
        <span>Email</span>
        <input id="restaurant-email" [(ngModel)]="email" type="email" />
      </label>

      <label class="field" for="restaurant-phone">
        <span>Téléphone</span>
        <input id="restaurant-phone" [(ngModel)]="phone" type="text" />
      </label>

      <label class="field" for="restaurant-address">
        <span>Adresse</span>
        <input id="restaurant-address" [(ngModel)]="address" type="text" />
      </label>

      <label class="field" for="restaurant-ninea">
        <span>NINEA</span>
        <input id="restaurant-ninea" [(ngModel)]="ninea" type="text" />
      </label>
    </div>

    <div class="settings-actions settings-actions-right">
      <button type="button" class="primary-btn" [disabled]="saving()" (click)="saveRestaurant()">
        {{ saving() ? 'Sauvegarde…' : 'Sauvegarder' }}
      </button>
    </div>
  </article>

  <section class="settings-bottom-grid">
    <article class="settings-card">
      <div class="section-head">
        <h2>Notifications</h2>
        <p>Gérez les alertes et les sons de confirmation.</p>
      </div>

      <div class="toggle-list">
        <button type="button" class="toggle-item" (click)="paymentAlertEnabled = !paymentAlertEnabled">
          <div class="toggle-copy">
            <strong>Alerte à chaque paiement</strong>
            <span>Recevoir une alerte à chaque transaction</span>
          </div>
          <span class="toggle-switch" [class.is-active]="paymentAlertEnabled">
            <span class="toggle-thumb"></span>
          </span>
        </button>

        <button type="button" class="toggle-item" (click)="confirmationSoundEnabled = !confirmationSoundEnabled">
          <div class="toggle-copy">
            <strong>Son de confirmation</strong>
            <span>Jouer un son lors de la validation</span>
          </div>
          <span class="toggle-switch" [class.is-active]="confirmationSoundEnabled">
            <span class="toggle-thumb"></span>
          </span>
        </button>
      </div>
    </article>

    <article class="settings-card">
      <div class="section-head">
        <h2>Sécurité</h2>
        <p>Modifier votre mot de passe.</p>
      </div>

      <div class="settings-grid settings-grid-single">
        <label class="field" for="current-password">
          <span>Mot de passe actuel</span>
          <input id="current-password" [(ngModel)]="currentPassword" type="password" autocomplete="current-password" />
        </label>

        <label class="field" for="new-password">
          <span>Nouveau mot de passe</span>
          <input id="new-password" [(ngModel)]="newPassword" type="password" autocomplete="new-password" />
        </label>

        <label class="field" for="confirm-password">
          <span>Confirmer</span>
          <input id="confirm-password" [(ngModel)]="confirmPassword" type="password" autocomplete="new-password" />
        </label>
      </div>

      <div class="settings-actions settings-actions-right">
        <button type="button" class="primary-btn" (click)="updatePassword()">Mettre à jour</button>
      </div>
    </article>
  </section>

  @if (feedback()) {
    <p role="status">{{ feedback() }}</p>
  }
</section>
